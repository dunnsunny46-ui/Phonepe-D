name: Build PhonePe Demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhonePeDemo-source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q PhonePeDemo-source.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: PhonePeDemo
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PhonePe-Demo-APK
          path: PhonePeDemo/app/build/outputs/apk/debug/app-debug.apk
